[package]
name = "llvm2cprover"
version = "0.1.0"
edition = "2024"
authors = ["The llvm2cprover Authors"]
license = "Apache-2.0"
description = "LLVM to GOTO-C translator"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
cprover_bindings = { path = "third_party/kani/cprover_bindings" }
inkwell = { git = "https://github.com/TheDan64/inkwell.git", rev = "3cf0506a4167f149b8fb56fb9714571f927a2306", features = ["llvm23-1"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1.0"
num = "0.4.3"

[lints.clippy]
too_many_arguments = "allow"
comparison_chain = "allow"
manual_range_contains = "allow"
type_complexity = "allow"
uninlined_format_args = "allow"
