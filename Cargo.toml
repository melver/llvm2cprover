[package]
name = "llvm2cprover"
version = "0.1.0"
edition = "2024"
authors = ["The llvm2cprover Authors"]
license = "Apache-2.0"
description = "LLVM to GOTO-C translator"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
cprover_bindings = { path = "third_party/kani/cprover_bindings" }
inkwell = { version = "0.10.0", features = ["llvm22-1"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1.0"
num = "0.4.3"
